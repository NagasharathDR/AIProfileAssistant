[tool]
name = "my-python-backend"
version = "0.1.0"
description = "A clean backend structure for a Python project."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "pytest"
]

[tool.poetry.dev-dependencies]
pytest = "^6.2"
black = "^21.0"
mypy = "^0.910"

[tool.poetry.scripts]
start = "app.main:main"